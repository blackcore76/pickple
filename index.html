<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>픽플 - 통합 검색 지도</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;overflow:hidden}
    #map{width:100vw;height:100vh}
    .search-box{position:absolute;top:16px;left:16px;right:16px;z-index:10;background:#fff;border-radius:16px;padding:12px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
    .search-box input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:15px}
    .results{position:absolute;top:88px;left:16px;right:16px;max-height:38vh;overflow:auto;background:#fff;border-radius:16px;z-index:10;box-shadow:0 4px 12px rgba(0,0,0,.15);display:none}
    .result-item{padding:12px;border-bottom:1px solid #eee;cursor:pointer}
    .result-item:hover{background:#f8f8f8}
    .tag{font-size:12px;color:#ff6b35;font-weight:bold}
  </style>
</head>
<body>
  <div class="search-box">
    <input id="searchInput" placeholder="상점명, 메뉴, 키워드 검색" />
  </div>
  <div id="results" class="results"></div>
  <div id="map"></div>

  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=c3d4ae950dc11417e5a5063b404fcfdb&libraries=services&libraries=services"></script>
  <script>
    let map;
    let markers=[];
    const places = new kakao.maps.services.Places();

    const userPicks = [
      {name:'착한정육점', keyword:['삼겹살','가성비'], review:'목살이 신선해요', lat:36.3504, lng:127.3845},
      {name:'한우마을', keyword:['한우','친절'], review:'사장님 설명이 좋아요', lat:36.3510, lng:127.3839}
    ];

    function initMap(){
      map = new kakao.maps.Map(document.getElementById('map'), {
        center:new kakao.maps.LatLng(36.3504,127.3845),
        level:4
      });
    }

    function clearMarkers(){
      markers.forEach(m=>m.setMap(null));
      markers=[];
    }

    function searchAll(keyword){
      if(!keyword.trim()) return;
      places.keywordSearch(keyword, function(data,status){
        const kakaoResults = status===kakao.maps.services.Status.OK ? data.map(item=>( {
          type:'kakao',
          name:item.place_name,
          address:item.address_name,
          lat:parseFloat(item.y),
          lng:parseFloat(item.x)
        })) : [];

        const localResults = userPicks.filter(p=>
          p.name.includes(keyword) ||
          p.keyword.some(k=>k.includes(keyword)) ||
          p.review.includes(keyword)
        ).map(p=>({...p,type:'user'}));

        const merged = mergeResults(kakaoResults, localResults);
        renderResults(merged);
      });
    }

    function mergeResults(kakaoResults, userResults){
      const merged=[...kakaoResults];
      userResults.forEach(user=>{
        const found = merged.find(item=>item.name===user.name);
        if(found){
          found.userReview = user.review;
          found.userTag = true;
        }else{
          merged.push(user);
        }
      });
      return merged;
    }

    function renderResults(items){
      const box=document.getElementById('results');
      box.innerHTML='';
      box.style.display = items.length ? 'block':'none';
      clearMarkers();

      items.forEach(item=>{
        const el=document.createElement('div');
        el.className='result-item';
        el.innerHTML=`<div>${item.name}</div>
          <div class="tag">${item.userTag || item.type==='user' ? '⭐ 사용자 픽' : '📍 카카오 장소'}</div>
          <div style="font-size:13px;color:#666">${item.userReview || item.address || ''}</div>`;

        el.onclick=()=>moveTo(item);
        box.appendChild(el);
        addMarker(item);
      });
    }

    function addMarker(item){
      const marker = new kakao.maps.Marker({
        map,
        position:new kakao.maps.LatLng(item.lat,item.lng)
      });
      markers.push(marker);
    }

    function moveTo(item){
      const pos = new kakao.maps.LatLng(item.lat,item.lng);
      map.panTo(pos);
      map.setLevel(3);
    }

    document.getElementById('searchInput').addEventListener('input', e=>{
      searchAll(e.target.value);
    });

    initMap();
  </script>
</body>
</html>
