<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>픽플 - 동네 사람이 직접 고른 진짜 정보</title>
  <link rel="manifest" href="/pickple/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/pickple/img/icon.png">
  <meta name="theme-color" content="#FF6B35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/pickple/css/style.css">
</head>
<body>

  <div class="app-header">🍖 <span>픽플</span></div>

  <div class="mode-banner" id="modeBanner">
    📍 지도를 탭해서 픽포인트를 추가하세요
    <button id="cancelAddMode" aria-label="추가 취소">✕</button>
  </div>

  <div class="loading" id="loading">📍 현재 위치 찾는 중...</div>

  <div class="toast error-toast" id="errorToast" role="alert"></div>
  <div class="toast success-toast" id="successToast" role="status"></div>

  <div id="map"></div>

  <div class="empty-hint" id="emptyHint">
    오른쪽 <strong>+</strong> 버튼으로 첫 픽포인트를 추가해보세요!
  </div>

  <button class="fab fab-location" id="locationBtn" aria-label="현재 위치로 이동">🎯</button>
  <button class="fab fab-add" id="addBtn" aria-label="픽포인트 추가">+</button>

  <div class="info-panel" id="infoPanel" role="dialog" aria-label="픽포인트 정보">
    <div class="panel-handle" id="panelHandle"></div>
    <div id="panelContent"></div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-label="픽포인트 작성">
    <div class="modal" id="addModal">
      <div class="modal-header">
        <h2 id="modalTitle">새 픽포인트</h2>
        <button class="modal-close" id="modalClose" aria-label="닫기">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="pickTitle">이름 <span class="required">*</span></label>
          <input type="text" id="pickTitle" class="form-input"
                 placeholder="예) 사장님이 친절한 정육점" maxlength="50" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label">카테고리</label>
          <div class="category-grid" id="categoryGrid"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="pickComment">한마디</label>
          <textarea id="pickComment" class="form-textarea"
                    placeholder="가격, 분위기, 서비스 등 솔직한 한마디를 남겨주세요"
                    maxlength="200"></textarea>
          <div class="char-count"><span id="charCount">0</span>/200</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelBtn">취소</button>
        <button class="btn btn-primary" id="saveBtn">저장하기</button>
      </div>
    </div>
  </div>

  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=c3d4ae950dc11417e5a5063b404fcfdb&libraries=services"></script>
  <script src="/pickple/js/app.js"></script>
</body>
</html>
